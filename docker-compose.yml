services:
  postgres:
    image: postgres:18-alpine
    container_name: crud-postgres
    environment:
      POSTGRES_DB: crudapp_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./data/postgres-init:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7.0
    container_name: crud-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./data/mongo-init:/docker-entrypoint-initdb.d

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: crud-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/crudapp_keycloak_db
      - KC_DB_USERNAME=user
      - KC_DB_PASSWORD=password
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_LOG_LEVEL=info
      - KC_HTTP_ENABLED=true
    ports:
      - "8081:8080"
    command: start --import-realm
    volumes:
      - ./data/keycloak:/opt/keycloak/data/import
    depends_on:
      - postgres

  crud-api:
    image: ghcr.io/73n37/crud-application:latest
    container_name: crud-api
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/crudapp_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/crudapp_db
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  caddy:
    image: caddy:2
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - crud-api

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-cd
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 admin password;
      /usr/bin/mc mb myminio/frontend-assets --ignore-existing;
      /usr/bin/mc anonymous set public myminio/frontend-assets;
      /usr/bin/mc cp -r /provision/ myminio/frontend-assets/;
      exit 0;
      "
    volumes:
      - ./data/minio-provision:/provision


volumes:
  postgres_data:
  mongo_data:
  caddy_data:
  caddy_config:
  minio_data:
