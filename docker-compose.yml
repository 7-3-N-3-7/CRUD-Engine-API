services:
  business-db:
    image: postgres:16-alpine
    container_name: crud-business-db
    environment:
      POSTGRES_DB: ${BUSINESS_DB_NAME}
      POSTGRES_USER: ${BUSINESS_DB_USER}
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - business_postgres_data:/var/lib/postgresql/data
      - ./data/postgres-init:/docker-entrypoint-initdb.d

  keycloak-db:
    image: postgres:16-alpine
    container_name: crud-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    container_name: crud-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./data/mongo-init:/docker-entrypoint-initdb.d

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: crud-keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_LOG_LEVEL=info
      - KC_HTTP_ENABLED=true
    ports:
      - "8081:8080"
    command: start-dev --import-realm
    volumes:
      - ./data/keycloak:/opt/keycloak/data/import
    depends_on:
      - keycloak-db

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/frontend-assets --ignore-existing;
      /usr/bin/mc anonymous set public myminio/frontend-assets;
      /usr/bin/mc cp -r /provision/ myminio/frontend-assets/ || true;
      exit 0;
      "
    volumes:
      - ./data/minio-provision:/provision

volumes:
  business_postgres_data:
  keycloak_postgres_data:
  mongo_data:
  minio_data:
