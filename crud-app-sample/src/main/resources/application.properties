# Application configuration
server.port=8080

# Logging level
logging.level.com.org73n37.crudapp=DEBUG

# Database Configuration (PostgreSQL from docker-compose)
# Credentials are externalized: override via environment variables / secrets in
# real deployments. The defaults only match the local docker-compose dev database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cruddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Keycloak Configuration
keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/auth/realms/crud-realm/protocol/openid-connect/certs}
keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8081/auth/realms/crud-realm}
# NOTE: keycloak.test.public-key is intentionally NOT set here.
# It is a development/test-only static verification key that bypasses
# Keycloak JWKS. It is supplied only by tests (see CrudAppIntegrationTest)
# and is refused at runtime when app.mode=PRODUCTION.

# Input Payload and Network Restrictions (Point 3)
server.max-http-header-size=8KB
spring.codec.max-in-memory-size=2MB
server.netty.connection-timeout=10s
server.netty.idle-timeout=30s
server.netty.max-keep-alive-requests=100

# Strict JSON Schema Validation (Point 5)
spring.jackson.deserialization.fail-on-unknown-properties=true

# RFC 7807 Problem Details Support
spring.webflux.problemdetails.enabled=true

# Enable forwarded headers parsing for reverse proxy compatibility
server.forward-headers-strategy=FRAMEWORK

# Whitelist frontend origins for CORS
# - localhost:5173 for local Vite dev server
# - GitHub Pages for the separate frontend repository
app.security.cors.allowed-origins=http://localhost:5173,https://73n37.github.io,http://45.9.191.167

# Application Environment Mode (PRODUCTION or DEVELOPMENT)
app.mode=PRODUCTION
